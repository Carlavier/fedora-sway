output * bg /usr/share/backgrounds/default.jxl fill

output DP-2 mode 1920x1080@99.650Hz pos 0 0
output DP-2 transform 0

output HDMI-A-1 transform 90
output HDMI-A-1 mode 1920x1080@100Hz pos 1920 -760

workspace 1 output DP-2
workspace 2 output DP-2
workspace 3 output DP-2
workspace 4 output DP-2
workspace 5 output DP-2

workspace S output HDMI-A-1

output * dpms on
output HDMI-A-1 disable

output DP-2 bg ~/.wallpaper/using/primary.* fill
output HDMI-A-1 bg ~/.wallpaper/using/secondary.* fill

exec_always python3 ~/.config/sway/portrait_manager.py
for_window [app_id="portrait_filler"] focus_on_window_activation none, no_focus
for_window [app_id="portrait_filler"] move container to output HDMI-A-1

exec output * power on
