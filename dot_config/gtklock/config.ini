[main]
gtk-theme=adw-gtk3-dark

time-format=%H:%M
date-format=%a, %b %d

modules=/home/carlavier/.config/gtklock/password-spacing.so

idle-hide=true
idle-timeout=15

lock-command=swayidle -w timeout 60 "swaymsg 'output * power off'" resume "swaymsg 'output * power on'"
unlock-command=sh -c 'pkill -x swayidle; swaymsg "output * power on"'
